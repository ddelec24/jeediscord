<!--template/scenario/cmd.action.message.jeediscordFile (plugin jeediscord)-->
<div class="jeediscordFile" data-uid="#uid#">
	<div class="input-group input-group-sm" style="width:100%">
		<span class="input-group-addon roundedLeft" style="width:110px">{{Fichiers}}</span>
		<textarea class="expressionAttr form-control ta_autosize roundedRight" data-l1key="options" data-l2key="files" rows="1" style="resize:vertical" data-uid="#uid#" placeholder="{{Chemin complet d'un fichier par ligne (10 maximum par message)}}">#files#</textarea>
	</div>
	<div class="input-group input-group-sm" style="width:100%;padding-top:1px">
		<span class="input-group-addon roundedLeft" style="width:110px">{{Message}}</span>
		<textarea class="expressionAttr form-control ta_autosize" data-l1key="options" data-l2key="message" rows="1" style="resize:vertical" data-uid="#uid#" placeholder="{{Texte accompagnant les fichiers (optionnel)}}">#message#</textarea>
		<span class="input-group-addon hasBtn roundedRight">
			<button class="btn btn-default roundedRight jeediscordListCmd" type="button" title="{{Sélectionner une commande}}" data-uid="#uid#"><i class="fas fa-list-alt"></i></button>
		</span>
	</div>
</div>
<script>
	(function() {
		var root = document.querySelector('.jeediscordFile[data-uid="#uid#"]')
		root.querySelectorAll('.expressionAttr[data-l1key="options"]').forEach(function(el) {
			if (el.value == '#' + el.getAttribute('data-l2key') + '#') {
				el.value = ''
			}
		})
		root.querySelector('.jeediscordListCmd').addEventListener('click', function() {
			var target = root.querySelector('.expressionAttr[data-l2key="message"]')
			jeedom.cmd.getSelectModal({ cmd: { type: 'info' } }, function(result) {
				target.insertAtCursor(result.human)
			})
		})
	})()
</script>
