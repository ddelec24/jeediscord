<!--template/scenario/cmd.action.message.jeediscordObjectSummary (plugin jeediscord)-->
<div class="input-group input-group-sm" style="width:100%">
	<span class="input-group-addon roundedLeft" style="width:110px">{{Objet}}</span>
	<input class="expressionAttr form-control input-sm" data-l1key="options" data-l2key="message" value="#message#" data-uid="#uid#" placeholder="{{Nom de l'objet}}">
	<span class="input-group-addon hasBtn roundedRight">
		<button class="btn btn-default roundedRight jeediscordListObject" type="button" title="{{Sélectionner un objet}}" data-uid="#uid#"><i class="fas fa-cube"></i></button>
	</span>
</div>
<script>
	(function() {
		var input = document.querySelector('.expressionAttr[data-l2key="message"][data-uid="#uid#"]')
		// Marqueur construit en deux morceaux : le core remplacerait un « #message# » écrit en entier par la valeur saisie
		if (input.value == '#' + 'message' + '#') {
			input.value = ''
		}
		input.closest('.expressionOptions').querySelector('.jeediscordListObject').addEventListener('click', function() {
			jeedom.object.all({
				onlyVisible: false,
				success: function(objects) {
					var options = []
					objects.forEach(function(object) {
						options.push({ text: object.name, value: object.name })
					})
					jeeDialog.prompt({
						title: '{{Sélectionner un objet}}',
						inputType: 'select',
						inputOptions: options,
						callback: function(result) {
							if (result !== null) {
								input.value = result
							}
						}
					})
				}
			})
		})
	})()
</script>
